{% load i18n %}
<div x-data="{
  chatOpen: false,
  chatWidth: parseInt(localStorage.getItem('chatOverlayWidth')) || 384,
  dragging: false,
  startDrag(e) {
    this.dragging = true;
    const startX = e.clientX;
    const startWidth = this.chatWidth;
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    const onMove = (e) => {
      const newWidth = startWidth + (startX - e.clientX);
      this.chatWidth = Math.max(300, Math.min(window.innerWidth * 0.8, newWidth));
    };
    const onUp = () => {
      this.dragging = false;
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      localStorage.setItem('chatOverlayWidth', this.chatWidth);
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }
}" class="chat-overlay-container">
  <!-- Sliding Tab -->
  <div
    class="pg-chat-tab"
    :class="{ 'opacity-0': chatOpen }"
    @click="chatOpen = true"
    x-show="!chatOpen"
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-300"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
  >
    <div class="flex items-center">
      <i class="fa fa-comments text-lg"></i>
      <span class="ml-2 hidden md:inline-block">{% translate "Chat" %}</span>
    </div>
  </div>

  <!-- Chat Overlay -->
  <div
    class="pg-chat-overlay"
    :style="'width: ' + chatWidth + 'px'"
    x-show="chatOpen"
    x-cloak
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="transform translate-x-full"
    x-transition:enter-end="transform translate-x-0"
    x-transition:leave="transition ease-in duration-300"
    x-transition:leave-start="transform translate-x-0"
    x-transition:leave-end="transform translate-x-full"

  >
    <!-- Drag Handle -->
    <div
      class="pg-chat-resize-handle"
      @mousedown.prevent="startDrag($event)"
    ></div>
    <!-- Header -->
    <div class="pg-chat-overlay-header">
      <h3 class="text-xl mb-1">{% translate "Chat Assistant" %}</h3>
      <button @click="chatOpen = false" >
        <i class="fa fa-times"></i>
      </button>
    </div>
    <!-- Chat Content -->
    <div class="pg-chat-overlay-content">
      {% include "chat/components/chat_thread_streaming.html" with embedded=True websocket_url=chat_websocket_url %}
    </div>
  </div>
</div>
