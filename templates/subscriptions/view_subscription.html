{% extends "web/app/app_base.html" %}
{% load static %}
{% block app %}
<section class="app-card">
  <div class="flex flex-col space-y-4 lg:flex-row lg:space-x-4 lg:space-y-0 lg:flex-row-reverse">
    <div class="basis-1/4 grow-0 shrink-0">
      <img src="{% static 'images/undraw/undraw_joyride.svg' %}" alt="Yay!">
    </div>
    <div class="flex-1">
      <h1 class="text-3xl font-bold mb-2">My Subscription</h1>
      <h2 class="text-xl mb-1">You're subscribed to a plan. Thanks for the support!</h2>
      <p class="text-xl mb-1">Subscription Details</p>
      {% include 'subscriptions/components/subscription_details.html' %}
    </div>
  </div>
  {% if subscription %}
  <form method="POST" action="{{ subscription_urls.create_stripe_portal_session }}" class="mt-2">
    {% csrf_token %}
    <button type="submit" class="btn btn-outline">Manage billing</button>
  </form>
  {% endif %}
</section>
{% endblock %}
