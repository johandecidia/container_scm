{% load i18n %}

<tr
  id="container-row-{{ container.pk }}"
  hx-target="this"
  hx-swap="outerHTML"
>
  <td>
    <a href="{% url 'containers:detail' container.pk %}" class="link link-hover font-medium">
      {{ container.container_number }}
    </a>
  </td>
  <td>{{ container.carrier|default:"—" }}</td>
  <td>{% include "scm/components/status_badge.html" with status=container.status %}</td>
  <td class="text-sm text-base-content/60">{{ container.etd|date:"Y-m-d"|default:"—" }}</td>
  <td class="text-sm text-base-content/60">{{ container.eta|date:"Y-m-d"|default:"—" }}</td>
  <td class="text-right">
    <div class="flex justify-end gap-1">
      <button
        class="btn btn-ghost btn-xs"
        hx-get="{% url 'containers:update' container.pk %}"
        hx-target="#modal-container"
        hx-swap="innerHTML"
      >
        <i class="fa fa-edit"></i>
      </button>
      <button
        class="btn btn-ghost btn-xs text-error"
        hx-delete="{% url 'containers:delete' container.pk %}"
        hx-confirm="{% translate 'Delete this container?' %}"
        hx-target="#container-row-{{ container.pk }}"
        hx-swap="outerHTML"
      >
        <i class="fa fa-trash"></i>
      </button>
    </div>
  </td>
</tr>
