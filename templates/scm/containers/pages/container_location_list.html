{% extends "scm/base.html" %}
{% load i18n %}

{% block app %}
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold">{% translate "Locations" %}</h1>
      <p class="text-sm text-base-content/60 mt-1">
        {% translate "Every place containers are recorded. Open one to see what is standing there and what has moved." %}
      </p>
    </div>
    <button
      class="btn btn-primary btn-sm"
      hx-get="{% url 'containers:location_create' %}"
      hx-target="#modal-container"
      hx-swap="innerHTML"
    >
      <i class="fa fa-plus w-4 h-4"></i>
      {% translate "Add Location" %}
    </button>
  </div>

  <section class="app-card">
    <div id="location-table">
      {% include "scm/containers/partials/container_location_table.html" %}
    </div>
  </section>

  <div id="modal-container"></div>
{% endblock %}
