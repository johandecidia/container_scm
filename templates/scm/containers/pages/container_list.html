{% extends "scm/base.html" %}
{% load i18n %}

{% block app %}
  <section class="app-card">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-semibold">{% translate "Containers" %}</h2>
      <button
        class="btn btn-primary btn-sm"
        hx-get="{% url 'containers:create' team_slug %}"
        hx-target="#modal-container"
        hx-swap="innerHTML"
      >
        <i class="fa fa-plus w-4 h-4"></i>
        {% translate "Add Container" %}
      </button>
    </div>

    {% include "scm/containers/partials/container_filters.html" %}

    <div id="container-table">
      {% include "scm/containers/partials/container_table.html" %}
    </div>
  </section>

  {# Modal mount point #}
  <div id="modal-container"></div>
{% endblock %}
