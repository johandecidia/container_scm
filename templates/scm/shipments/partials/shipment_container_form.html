{% load i18n %}

<dialog id="shipment-container-modal" class="modal modal-open">
  <div class="modal-box max-w-lg">
    <form
      method="post"
      hx-post="{% url 'shipments:container_add' shipment.pk %}"
      hx-target="#shipment-container-list"
      hx-swap="outerHTML"
      hx-on::after-request="if(event.detail.successful) document.getElementById('shipment-container-modal').close()"
    >
      {% csrf_token %}
      <h3 class="font-bold text-lg mb-4">{% translate "Add Container" %}</h3>

      <div class="form-control mb-3">
        <label class="label" for="{{ form.container.id_for_label }}">
          <span class="label-text">{{ form.container.label }}</span>
        </label>
        {{ form.container }}
        {% if form.container.errors %}
          <p class="text-error text-sm mt-1">{{ form.container.errors.0 }}</p>
        {% endif %}
      </div>

      <div class="grid grid-cols-2 gap-3 mb-3">
        <div class="form-control">
          <label class="label" for="{{ form.sequence.id_for_label }}">
            <span class="label-text">{{ form.sequence.label }}</span>
          </label>
          {{ form.sequence }}
        </div>
        <div class="form-control">
          <label class="label" for="{{ form.seal_number.id_for_label }}">
            <span class="label-text">{{ form.seal_number.label }}</span>
          </label>
          {{ form.seal_number }}
        </div>
      </div>

      <div class="form-control mb-3">
        <label class="label" for="{{ form.gross_weight_kg.id_for_label }}">
          <span class="label-text">{{ form.gross_weight_kg.label }}</span>
        </label>
        {{ form.gross_weight_kg }}
      </div>

      <div class="form-control mb-4">
        <label class="label" for="{{ form.notes.id_for_label }}">
          <span class="label-text">{{ form.notes.label }}</span>
        </label>
        {{ form.notes }}
      </div>

      <div class="modal-action">
        <button type="button" class="btn btn-ghost" onclick="document.getElementById('shipment-container-modal').close()">
          {% translate "Cancel" %}
        </button>
        <button type="submit" class="btn btn-primary">{% translate "Add" %}</button>
      </div>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>{% translate "close" %}</button>
  </form>
</dialog>
