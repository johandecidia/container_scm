{% load i18n %}

<dialog id="shipment-status-modal" class="modal modal-open">
  <div class="modal-box max-w-sm">
    <form
      method="post"
      hx-post="{% url 'shipments:status_update' shipment.pk %}"
      hx-target="#shipment-row-{{ shipment.pk }}"
      hx-swap="outerHTML"
      hx-on::after-request="if(event.detail.successful) document.getElementById('shipment-status-modal').close()"
    >
      {% csrf_token %}
      <h3 class="font-bold text-lg mb-4">{% translate "Change Status" %}</h3>

      <div class="form-control mb-4">
        <label class="label" for="{{ form.status.id_for_label }}">
          <span class="label-text">{{ form.status.label }}</span>
        </label>
        {{ form.status }}
        {% if form.status.errors %}
          <p class="text-error text-sm mt-1">{{ form.status.errors.0 }}</p>
        {% endif %}
      </div>

      <div class="modal-action">
        <button type="button" class="btn btn-ghost" onclick="document.getElementById('shipment-status-modal').close()">
          {% translate "Cancel" %}
        </button>
        <button type="submit" class="btn btn-primary">{% translate "Update" %}</button>
      </div>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>{% translate "close" %}</button>
  </form>
</dialog>
