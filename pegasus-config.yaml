  description: Container Supply Chain Layer is an operational platform built for container
    trading, depot operations, and inbound logistics management.  The system connects
    procurement, shipment tracking, inventory, landed cost, reservation management,
    and dispatch planning into one unified operational layer. It provides real-time
    visibility into what containers are ordered, in transit, available, reserved,
    and ready for delivery.  Designed to integrate with ERP systems, depot systems,
    and shipping line tracki
